<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 3 - Tema 7</title>
</head>

<body>
    <!-- 1. ID para identificar el encabezado -->
    <header id="encabezado">
        <h1>Coches.net</h1>
    </header>

    <!-- 5. Elemento con dos clases -->
    <p class="oferta banner-destacado">¡OFERTA BLACK FRIDAY: 20 % de descuento hoy!</p>

    <main>
        <!-- 2. Todas los articulos comparten el mismo nombre de clase = tarjetas -->
        <article class="tarjeta">
            <h2>Audi Q3</h2>
            <p>50.000 €</p>
            <!-- 3. Identificar todos los botones con otro nombre de clases -->
            <button class="boton-tarjetas">Ver más</button>
        </article>
        <!-- 4. Clase modificadora  -->
        <article class="tarjeta tarjeta--destacada">
            <h2>Porsche Cayman</h2>
            <p>150.000 €</p>
            <button class="boton-tarjetas">Ver más</button>
        </article>
        <article class="tarjeta">
            <h2>Lamborguini veneno</h2>
            <p>1.000.000 €</p>
            <button class="boton-tarjetas">Ver más</button>
        </article>
    </main>
</body>

</html>
