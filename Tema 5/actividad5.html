<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5 - Diseño de Ancho Variable (Fluido)</title>
</head>
<body style="background-color: #f4f4f4; font-family: Arial, sans-serif; margin: 0; padding: 20px;">

    <!-- Contenedor principal con ancho variable / fluido -->
    <div style="width: 90%; max-width: 1200px; margin: 0 auto; background-color: #ffffff; padding: 20px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); box-sizing: border-box;">
        
        <header style="border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
            <h1>Cabecera de Ancho Variable</h1>
        </header>

        <main>
            <h2>Contenido Principal Líquido</h2>
            <p>Esta página web adapta su ancho de forma porcentual (ocupando el <strong>90%</strong> de la ventana y hasta un máximo de 1200 píxeles). Al redimensionar el navegador, el contenedor se expande o se contrae continuamente.</p>
        </main>

        <footer style="border-top: 1px solid #ccc; margin-top: 20px; padding-top: 10px; text-align: center; font-size: 0.9em; color: #666;">
            <p>Pie de página - Ejercicio 5 UD5</p>
        </footer>

    </div>

</body>
</html>
