<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi centro educativo</title>

    <style>
        h1{
            color: blue;
            font-size: 32px;
        }

        .primer_subtitulo{
            color: green;
        }

        /* Usamos el punto para poder acceder a la etiqueta */
        .ultimo_texto{
            text-align: center;
        }

        /* 1. Aplicamos 18 pixeles a cada parrafo */
        p{
            font-size: 18px;
        }

        /* 2. Le asignamos a todos los subtitulos el color naranja */
        h2{
            color: orange;
        }
    </style>

</head>
<body>

    <h1>IES Los Remedios</h1>

    <h2 class="primer_subtitulo">Oferta educativa</h2>

    <p>En nuestro centro impartimos diferentes
       ciclos formativos.</p>

    <h2>Ciclos formativos</h2>

    <ul>
        <li>Desarrollo de Aplicaciones Web</li>
        <li>Administración de Sistemas Informáticos</li>
    </ul>

    <!-- Le asignamos un nombre a traves de una clase para que luego el estilo no se aplique a todos los <p> -->
    <p class="ultimo_texto">Consulta nuestra oferta educativa.</p>

</body>
</html>
